[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plat-harness"
version = "0.1.0"
description = "Agent-agnostic control plane for multifamily underwriting and ops. The model is rented."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "paintbrush"}
]
keywords = [
    "multifamily",
    "real-estate",
    "underwriting",
    "control-plane",
    "agent-tools",
    "proptech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Real Estate",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.2,<3",
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<6",
    'tomli>=2; python_version < "3.11"',
]
# CSV ingestion is stdlib-only; spreadsheet readers are opt-in.
ingest = [
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.2,<3",
]
# PDF rent-roll ingest and the synthetic PDF test generator. Opt-in: a core
# install must parse nothing and install no PDF stack it did not ask for.
pdf = [
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<6",
]
# Engine extra is documented, not vendored. Set PLAT_HARNESS_ENGINE_ROOT.
engine = []
# Sovereign extra: the owner-reviewed private native runtime pins. These GPU
# frameworks are optional and only imported inside explicitly authorized
# sovereign workflows; a core install never pays for them. Pins match the
# reviewed private runtime venv exactly.
sovereign = [
    "torch==2.11.0",
    "transformers==5.5.0",
    "peft==0.20.0",
    "trl==0.24.0",
    "datasets==4.3.0",
    "accelerate==1.14.0",
    "unsloth==2026.8.18",
]

[project.scripts]
plat-harness = "plat_harness.cli:main"
plat-underwrite = "plat_harness.cli_underwrite:main"
plat-ops = "plat_harness.cli_ops:main"

[tool.setuptools.packages.find]
where = ["harness/src"]

[tool.setuptools.package-data]
plat_harness = ["py.typed", "samples_data/*"]

[project.urls]
Homepage = "https://github.com/paintbrushv/plat-harness"
Repository = "https://github.com/paintbrushv/plat-harness"
Issues = "https://github.com/paintbrushv/plat-harness/issues"
Changelog = "https://github.com/paintbrushv/plat-harness/blob/main/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The storage/acceptance layers refuse group/world-writable (or sticky-bit)
# artifact ancestors by design; pytest's default basetemp lives under /tmp
# (mode 1777) and trips that gate. Keep the basetemp inside the clone, where
# ancestor modes are safe. An explicit --basetemp on the CLI overrides this.
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["harness/src"]
