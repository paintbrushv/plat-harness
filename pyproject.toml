[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plat-harness"
version = "0.1.0"
description = "Agent-agnostic control plane for multifamily underwriting and ops. The model is rented."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Engine extra is documented, not vendored. Set PLAT_HARNESS_ENGINE_ROOT.
engine = []

[project.scripts]
plat-harness = "plat_harness.cli:main"

[tool.setuptools.packages.find]
where = ["harness/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["harness/src"]
