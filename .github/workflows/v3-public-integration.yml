name: V3 public integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact reviewed public commits
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/paintbrushv/plat-agent.git@7ceb818eae4b8bb50ef8c6986ad72bf1b106f80e"
          python -m pip install "git+https://github.com/paintbrushv/plat-costmodel.git@518142ecb8771e52fcc9985237fe1a6f97a76168"
          python -m pip install "git+https://github.com/paintbrushv/plat-multifamily-underwriting.git@0d106d601e6ae989d6942b424f8cd9b7b1173576"
          python -m pip install "git+https://github.com/paintbrushv/plat-harness.git@aa7f8653090fc1e1393b72b4c155c49af44116db"
          python -m pip check
      - name: Verify isolated installed-package integration
        run: |
          env -u PYTHONPATH -u PLAT_COSTMODEL_PATH -u PLAT_COSTMODEL_DEFERRED_PATH \
            -u PLAT_MULTIFAMILY_UNDERWRITING_PATH -u UNDERWRITING_ENGINE_PATH \
            python -I scripts/verify_public_install.py
