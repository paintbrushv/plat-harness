name: V3 public integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installed-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact reviewed public commits
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/paintbrushv/plat-agent.git@cc484170e413d9d49c407775fd9e3f9480b24d19"
          python -m pip install "git+https://github.com/paintbrushv/plat-costmodel.git@518142ecb8771e52fcc9985237fe1a6f97a76168"
          python -m pip install "git+https://github.com/paintbrushv/plat-multifamily-underwriting.git@10a88ed393e6d6611c8c710b5e15ef64e128af6b"
          python -m pip install .
          python -m pip check
      - name: Verify isolated installed-package integration
        run: |
          env -u PYTHONPATH -u PLAT_COSTMODEL_PATH -u PLAT_COSTMODEL_DEFERRED_PATH \
            -u PLAT_MULTIFAMILY_UNDERWRITING_PATH -u UNDERWRITING_ENGINE_PATH \
            -u PLAT_DEALS_ROOT -u UNDERWRITING_MCP_CMD -u PLAT_COSTMODEL_CMD \
            PLAT_HARNESS_EXPECTED_SHA="$GITHUB_SHA" python -I scripts/verify_public_install.py
