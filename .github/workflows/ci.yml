name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # Windows runners reject the fail-closed mode gates' umask discipline
          # in several store-layer tests; the Linux/macOS legs carry the gate
          # coverage. Kept out rather than weakened.
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core (model-free)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build "setuptools>=77" wheel
      - name: Full Linux core suite (offline, no credentials)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLAT_VENDOR_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # The store/acceptance layers refuse /tmp and other writable ancestors.
          install -d -m 700 "$HOME/.plat-harness-ci-tmp"
          export TMPDIR="$HOME/.plat-harness-ci-tmp"
          umask 0077
          pytest -p no:cacheprovider -o addopts= --basetemp="$TMPDIR/pytest" -q tests
      - name: Portable contract suite
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pytest -p no:cacheprovider -o addopts= -q \
            tests/test_agent_agnostic.py \
            tests/test_synthetic_read_http.py \
            tests/test_underwriting_direction.py \
            tests/test_reasonability.py \
            tests/test_original_thesis.py \
            tests/test_test001_review.py

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Smoke test wheel in fresh venv
        run: python .github/scripts/smoke_wheel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
