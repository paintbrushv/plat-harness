name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core (model-free)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core suite (offline, no credentials)
        env:
          PLAT_VENDOR_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # The store/acceptance layers refuse group/world-writable artifact
          # paths by design (fail-closed mode gates); run under a private umask.
          umask 0077
          pytest -p no:cacheprovider -o addopts= -q tests
