name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # Windows runners reject the fail-closed mode gates' umask discipline
          # in several store-layer tests; the Linux/macOS legs carry the gate
          # coverage. Kept out rather than weakened.
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core (model-free)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core suite (offline, no credentials)
        env:
          PLAT_VENDOR_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # The store/acceptance layers refuse group/world-writable artifact
          # paths by design (fail-closed mode gates); run under a private umask.
          umask 0077
          pytest -p no:cacheprovider -o addopts= -q tests

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Smoke test wheel in fresh venv
        run: python .github/scripts/smoke_wheel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/